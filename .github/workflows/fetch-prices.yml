name: Fetch Prices

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 22:00 UTC Mon–Fri — after all global markets closed
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip price fetch and redeploy current data'
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit docs/data/ back to the repo
  pages: write                # needed to deploy to GitHub Pages
  id-token: write             # needed for Pages OIDC authentication

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        if: ${{ !inputs.deploy_only }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: ${{ !inputs.deploy_only }}
        run: pip install requests beautifulsoup4

      - name: Create docs/data directory
        if: ${{ !inputs.deploy_only }}
        run: mkdir -p docs/data

      - name: Fetch prices
        if: ${{ !inputs.deploy_only }}
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/fetch_prices.py

      - name: Commit and push data
        if: ${{ !inputs.deploy_only }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "chore: update fund prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

      - name: Inject commit hash
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s|__COMMIT__|$SHA|g" docs/index.html

      - name: Inject PAT
        env:
          FUND_REFRESH_PAT: ${{ secrets.FUND_REFRESH_PAT }}
        run: |
          sed -i "s|__FUND_REFRESH_PAT__|$FUND_REFRESH_PAT|g" docs/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: fetch                # only runs after fetch job succeeds
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4