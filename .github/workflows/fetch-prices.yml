name: Fetch Prices

on:
  schedule:
    - cron: '0 6 * * 1-5'   # 06:00 UTC, Monday–Friday
  workflow_dispatch:          # manual trigger from Actions tab

permissions:
  contents: write             # needed to commit docs/data/ back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Create docs/data directory
        run: mkdir -p docs/data

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: update fund prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push